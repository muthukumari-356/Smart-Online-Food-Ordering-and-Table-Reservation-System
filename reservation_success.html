<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservation Confirmed</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

```
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: url('/static/images/restaurant-bg.png') no-repeat center center fixed;
        background-size: cover;
    }

    .success-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
    }

    .success-card {
        background: rgba(255,255,255,0.95);
        padding: 40px;
        border-radius: 20px;
        width: 500px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .success-card h1 {
        color: #28a745;
        margin-bottom: 20px;
    }

    .booking-info {
        text-align: left;
        margin: 25px 0;
        line-height: 2;
        font-size: 18px;
    }

    .booking-info strong {
        color: #ff9800;
    }

    .btn {
        display: inline-block;
        margin-top: 20px;
        padding: 12px 25px;
        background: #ff9800;
        color: white;
        text-decoration: none;
        border-radius: 10px;
        font-weight: bold;
    }

    .btn:hover {
        background: #e68900;
    }
</style>
```

</head>
<body>

<div class="success-container">
    <div class="success-card">

```
    <h1>Reservation Confirmed</h1>
    <p>Your table has been successfully reserved.</p>

    <div class="booking-info">
        <p><strong>Booking ID:</strong> #{{ booking_id }}</p>
        <p><strong>Name:</strong> {{ customer_name }}</p>
        <p><strong>Table Number:</strong> Table {{ table_number }}</p>
        <p><strong>Date:</strong> {{ reservation_date }}</p>
        <p><strong>Time:</strong> {{ reservation_time }}</p>
        <p><strong>Guests:</strong> {{ guests }}</p>
    </div>

    <a href="/menu" class="btn">Continue to Menu</a>

</div>
```

</div>

</body>
</html>
